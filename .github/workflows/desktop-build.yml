# Instalables de la app de escritorio nativa (Qt 6 + QML, carpeta DESKTOP/)
# para Linux, Windows y macOS, y la carpeta lista para subir a
# releases.startcode.com.co.
#
# - Tag `v*` (igual a la versión de `project(StartCodePanel VERSION …)` en
#   DESKTOP/CMakeLists.txt): versión publicable, las tres plataformas y la
#   carpeta del sitio.
# - macOS se compila una sola vez como binario universal (Intel y Apple
#   Silicon en el mismo .app): un job de macOS cuesta 10 minutos de la cuota
#   por cada minuto.
# - Manual (Actions → "Desktop build" → Run workflow, requiere el workflow en
#   la rama por defecto): eliges plataformas; solo con «all» se genera la
#   carpeta del sitio.
#
# Qué sale (pasos y scripts explicados en DESKTOP/packaging/LEEME.md):
#   Linux    StartCode-Panel-<versión>-x86_64.AppImage
#   Windows  StartCode-Panel-<versión>-Instalador.exe
#   macOS    StartCode-Panel-<versión>-macOS.dmg y .zip
# más el artefacto `release-site-<versión>` con la carpeta `startcode-panel/`
# (versions.json + files/<versión>/) que se sube tal cual al sitio.
#
# La URL del backend no se versiona: va dentro de la app al compilar
# (-DSTARTCODE_API_URL) y sale de un secreto del repositorio.
#
# Configuración del repositorio (Settings → Secrets and variables → Actions):
#   Secrets:   STARTCODE_API_URL (o el antiguo VITE_API_URL, que sigue valiendo)
#   Opcionales: WINDOWS_CERTIFICATE (.pfx en base64) y
#              WINDOWS_CERTIFICATE_PASSWORD: firman startcode-panel.exe (el
#              instalador no se puede firmar tal cual, ver LEEME.md);
#              APPLE_SIGNING_IDENTITY («Developer ID Application: …», con el
#              certificado ya en el llavero del runner): sin él, firma ad hoc.
name: Desktop build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Plataformas
        type: choice
        options: [all, windows, linux, macos]
        default: all
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # El Qt con el que se desarrolla la app (mínimo admitido: 6.9).
  QT_VERSION: '6.12.1'

jobs:
  # Falla en segundos si la versión no está lista, antes de gastar minutos
  # de macOS: tag ≠ versión, falta su entrada en versions.json o falta el
  # secreto con la URL del backend.
  check:
    name: Comprobar versión
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.plan.outputs.matrix }}
      site: ${{ steps.plan.outputs.site }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Versión, versions.json y tag
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          errors = []
          cmake = open('DESKTOP/CMakeLists.txt', encoding='utf-8').read()
          m = re.search(r'^project\(StartCodePanel\s+VERSION\s+([0-9.]+)', cmake, re.M)
          if not m:
              sys.exit('::error::No se pudo leer la versión de DESKTOP/CMakeLists.txt (project(StartCodePanel VERSION x.y.z …) en una sola línea).')
          version = m.group(1)
          tag = os.environ.get('TAG', '')

          def parse(v):
              p = re.fullmatch(r'(\d+)\.(\d+)\.(\d+)', v or '')
              return tuple(map(int, p.groups())) if p else None

          current = parse(version)
          if not current:
              errors.append(f'La versión {version} no es semver x.y.z.')
          if tag and tag.removeprefix('v') != version:
              errors.append(f'El tag {tag} no coincide con la versión {version} de DESKTOP/CMakeLists.txt.')

          versions = json.load(open('DESKTOP/assets/release/versions.json', encoding='utf-8')).get('versions', [])
          entry = next((v for v in versions if v.get('version') == version), None)
          if not entry:
              errors.append(f'DESKTOP/assets/release/versions.json no tiene la entrada de {version}.')
          else:
              if entry.get('type') not in ('major', 'minor', 'patch'):
                  errors.append(f'type "{entry.get("type")}" no es major, minor ni patch.')
              if not re.fullmatch(r'\d{4}-\d{2}-\d{2}', entry.get('date') or ''):
                  errors.append('date debe ser AAAA-MM-DD.')
              if not sum(len(c) for c in (entry.get('changes') or {}).values()):
                  errors.append(f'La versión {version} no lista ningún cambio.')
              # El tipo tiene que corresponder con el salto respecto a la anterior.
              older = sorted(p for p in map(parse, (v.get('version') for v in versions)) if p and current and p < current)
              if older and current:
                  prev = older[-1]
                  expected = 'major' if current[0] > prev[0] else 'minor' if current[1] > prev[1] else 'patch'
                  if entry.get('type') != expected:
                      errors.append(f'De {".".join(map(str, prev))} a {version} es un salto {expected}, pero type dice {entry.get("type")}.')

          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          print(f'Versión {version} lista para publicar.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\n')
          PY

      # El valor nunca se imprime: GitHub enmascara los secretos en el log.
      - name: Secretos
        env:
          API_URL: ${{ secrets.STARTCODE_API_URL || secrets.VITE_API_URL }}
        run: |
          [ -n "$API_URL" ] || { echo "::error::Falta el secreto STARTCODE_API_URL (URL del backend, p. ej. https://panel.ejemplo.com/api/v1)."; exit 1; }
          case "$API_URL" in
            *localhost*|*127.0.0.1*) echo "::warning::El secreto STARTCODE_API_URL apunta a localhost: la app instalada buscará el backend en la máquina del usuario." ;;
          esac

      # Qué se compila: todo con un tag, lo elegido en una ejecución manual.
      # La carpeta del sitio solo sale de una compilación completa.
      - id: plan
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          platforms = os.environ['INPUT_PLATFORMS']
          # ubuntu-22.04: el AppImage pide la glibc del sistema donde se compila o posterior.
          todas = [
              {'name': 'Linux (x64)', 'os': 'ubuntu-22.04', 'artifact': 'startcode-panel-linux-x86_64', 'group': 'linux'},
              {'name': 'Windows (x64)', 'os': 'windows-latest', 'artifact': 'startcode-panel-windows-x86_64', 'group': 'windows'},
              {'name': 'macOS (Universal)', 'os': 'macos-latest', 'artifact': 'startcode-panel-darwin-universal', 'group': 'macos'},
          ]
          include = [p for p in todas if platforms in ('all', p['group'])]
          print(f'matrix={json.dumps({"include": include})}')
          print(f'site={"true" if platforms == "all" else "false"}')
          PY

  build:
    name: ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    runs-on: ${{ matrix.os }}

    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      # ── Herramientas ────────────────────────────────────────────────
      # Lo que Qt (xcb y Wayland) y linuxdeploy necesitan para compilar y
      # para copiar las bibliotecas al AppImage.
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config build-essential file \
            libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libfontconfig1 libfreetype6 libdbus-1-3 libgtk-3-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-util1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Dependencias de sistema (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja pkgconf

      # pkg-config propio: el del runner es el de Strawberry Perl.
      - name: Dependencias de sistema (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja pkgconfiglite -y --no-progress

      # Compilador de Visual C++ en el PATH (cl, signtool, dumpbin) y
      # VCToolsRedistDir, que usa empaquetar.ps1 para el runtime.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      # Deja QT_ROOT_DIR y el bin de Qt en el PATH. En macOS el Qt oficial es
      # universal.
      # Python fijado: la acción de Qt usa por defecto el 3.x más reciente del
      # runner, y con uno recién publicado su instalador (aqtinstall) falla en
      # Windows al no haber aún paquetes compilados de sus dependencias.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true
          setup-python: false

      # ── libvterm ────────────────────────────────────────────────────
      # Estática y con versión fijada en las tres plataformas (en Windows y
      # macOS no existe; en Linux evita depender de la del runner).
      - name: Compilar libvterm
        shell: bash
        working-directory: DESKTOP
        run: |
          # Ruta absoluta con barras normales también en Windows (pwd -W de Git Bash).
          prefijo="$(pwd -W 2>/dev/null || pwd)/deps"
          cmake -S packaging/libvterm -B build-vterm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_INSTALL_PREFIX=$prefijo" -DCMAKE_INSTALL_LIBDIR=lib \
            ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}
          cmake --build build-vterm --target install

      # ── La app ──────────────────────────────────────────────────────
      # La URL del backend llega por variable de entorno, no por la línea de
      # comandos del workflow.
      - name: Compilar la app (Linux y macOS)
        if: runner.os != 'Windows'
        working-directory: DESKTOP
        env:
          API_URL: ${{ secrets.STARTCODE_API_URL || secrets.VITE_API_URL }}
        run: |
          cmake -S . -B build-paquete -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR;$PWD/deps" \
            "-DSTARTCODE_API_URL=$API_URL" \
            ${{ runner.os == 'macOS' && '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"' || '' }}
          cmake --build build-paquete

      - name: Compilar la app y el instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: DESKTOP
        env:
          API_URL: ${{ secrets.STARTCODE_API_URL || secrets.VITE_API_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          # CMake quiere las rutas con barras normales.
          $qt = $env:QT_ROOT_DIR -replace '\\', '/'
          $deps = "$PWD/deps" -replace '\\', '/'
          $pkgconfig = (Get-Command pkg-config.exe).Source -replace '\\', '/'
          cmake -S . -B build-paquete -G Ninja -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_PREFIX_PATH=$qt;$deps" "-DPKG_CONFIG_EXECUTABLE=$pkgconfig" `
            "-DSTARTCODE_API_URL=$env:API_URL"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-paquete
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake -S installer -B build-instalador -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-instalador
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Firma de código de Windows (quita "Editor desconocido" del ejecutable
      # de la app). Solo si existe el secreto. El instalador no se firma: la
      # firma iría detrás del paquete pegado y dejaría de encontrarlo.
      - name: Firmar startcode-panel.exe (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        working-directory: DESKTOP
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          Write-Host "Firmando con el certificado de: $($cert.Subject)"
          signtool sign /sha1 $cert.Thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 build-paquete/startcode-panel.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ── Empaquetar ──────────────────────────────────────────────────
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: DESKTOP
        run: packaging/linux/appimage.sh build-paquete dist

      - name: Instalador (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: DESKTOP
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist | Out-Null
          ./installer/empaquetar.ps1 -Panel build-paquete/startcode-panel.exe `
            -Instalador build-instalador/StartCodePanelInstalador.exe `
            -Salida "dist/StartCode-Panel-${{ needs.check.outputs.version }}-Instalador.exe"

      - name: .dmg y .zip (macOS)
        if: runner.os == 'macOS'
        working-directory: DESKTOP
        env:
          STARTCODE_UNIVERSAL: '1'
          STARTCODE_FIRMA: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: packaging/macos/empaquetar.sh build-paquete/startcode-panel.app dist

      - name: Subir instalables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            DESKTOP/dist/*.AppImage
            DESKTOP/dist/*.exe
            DESKTOP/dist/*.dmg
            DESKTOP/dist/*.zip

  # Carpeta que se sube tal cual a releases.startcode.com.co:
  #   startcode-panel/versions.json           lo que consulta la app (novedades y versión nueva)
  #   startcode-panel/files/<versión>/…       los instalables
  # La app nativa no se actualiza sola: avisa y abre la página de descargas,
  # así que ya no hay latest.json por plataforma ni firmas del actualizador.
  site:
    name: Carpeta para releases.startcode.com.co
    needs: [check, build]
    if: needs.check.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: startcode-panel-*
          path: artifacts

      - name: Armar versions.json y archivos
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          destino="site/startcode-panel/files/$VERSION"
          mkdir -p "$destino"
          cp DESKTOP/assets/release/versions.json site/startcode-panel/versions.json
          find artifacts -type f \( -name '*.AppImage' -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} "$destino/" \;
          for patron in '*.AppImage' '*-Instalador.exe' '*.dmg'; do
            compgen -G "$destino/$patron" > /dev/null || { echo "::error::Falta el instalable $patron"; exit 1; }
          done
          (cd "$destino" && sha256sum * > SHA256SUMS)
          ls -lh "$destino"

      - uses: actions/upload-artifact@v4
        with:
          name: release-site-${{ needs.check.outputs.version }}
          path: site
          if-no-files-found: error
