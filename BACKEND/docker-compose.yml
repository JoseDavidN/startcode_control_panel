# StartCode Panel — backend en producción, con la imagen de Docker Hub.
#
#   cp .env.production.example .env.production   # y completar
#   docker compose --env-file .env.production pull
#   docker compose --env-file .env.production up -d
#
# Por defecto usa una base PostgreSQL y un Redis que ya existen (DB_HOST y
# REDIS_HOST en .env.production). Para que el compose los levante también,
# dejar esas variables vacías y activar sus perfiles:
#
#   docker compose --env-file .env.production --profile db --profile cache up -d
#
# Ver DEPLOY.md: primera instalación, migraciones, actualización y copias.

name: startcode-panel

services:
  api:
    image: ${DOCKERHUB_USER:?Falta DOCKERHUB_USER en .env.production}/startcode-panel-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    # tini como PID 1: reenvía SIGTERM a node y recoge procesos huérfanos.
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      # Vacíos: los servicios `postgres` y `redis` de este compose (perfiles db y cache).
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      AGENT_DIST_DIR: /app/agent-dist
    ports:
      # Con un proxy inverso (TLS) delante, publicar solo en local:
      #   "127.0.0.1:3001:3001"
      - "${API_PORT:-3001}:3001"
    volumes:
      # Instalador y binarios del agente (los publica `make release` del repositorio del agente).
      - ./agent-dist:/app/agent-dist:ro
    # Solo esperan si su perfil está activo; con base y Redis externos, no aplican.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    dns:
      - 1.1.1.1
      - 8.8.8.8

  # ── Opcional: PostgreSQL propio (--profile db) ─────────────────────
  postgres:
    profiles: [db]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME en .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Falta DB_USERNAME en .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Esquema inicial: solo se aplica al crear el volumen (instalación nueva).
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: solo la alcanza el backend por la red interna.

  # ── Opcional: Redis propio (--profile cache), solo caché ───────────
  redis:
    profiles: [cache]
    image: redis:7-alpine
    restart: unless-stopped
    # Sin persistencia en disco. Con este perfil, REDIS_PASSWORD es obligatoria.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-}
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

# Volumen externo de la base (perfil db): se crea una vez fuera del compose
# (docker volume create; ver DEPLOY.md para tenerlo en /srv) y `down -v` no lo borra.
volumes:
  pgdata:
    external: true
    name: ${DB_VOLUME:-startcode-pgdata}
