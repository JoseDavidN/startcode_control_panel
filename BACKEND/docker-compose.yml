# StartCode Panel — backend en producción.
#
#   cp .env.production.example .env.production   # y completar
#   docker compose --env-file .env.production up -d --build
#
# Ver DEPLOY.md: primera instalación, migraciones, actualización y copias.

name: startcode-panel

services:
  api:
    build:
      context: .
    image: startcode-panel-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      # Dentro de la red de compose, los servicios se alcanzan por su nombre.
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AGENT_DIST_DIR: /app/agent-dist
    ports:
      # Con un proxy inverso (TLS) delante, publicar solo en local:
      #   "127.0.0.1:3001:3001"
      - "${API_PORT:-3001}:3001"
    volumes:
      # Instalador y binarios del agente (los publica `make release` del repositorio del agente).
      - ./agent-dist:/app/agent-dist:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Falta DB_NAME en .env.production}
      POSTGRES_USER: ${DB_USERNAME:?Falta DB_USERNAME en .env.production}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Esquema inicial: solo se aplica al crear el volumen (instalación nueva).
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    # Sin puertos publicados: solo la alcanza el backend por la red interna.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Solo caché: sin persistencia en disco. La contraseña es obligatoria.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env.production}
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  pgdata:
