<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon_black.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Startcode Control Panel</title>
    <script>
      /* Tema antes del primer paint: evita el destello oscuro al abrir con
         un tema claro. Misma clave de caché que PreferencesContext. */
      try {
        var p = JSON.parse(localStorage.getItem('startcode:prefs') || 'null');
        var a = (p && p.prefs && p.prefs.appearance) || {};
        document.documentElement.dataset.theme =
          ['dark', 'aurora', 'solar'].indexOf(a.theme) >= 0 ? a.theme : 'dark';
        document.documentElement.dataset.font =
          ['grotesk', 'mono', 'rounded'].indexOf(a.font) >= 0 ? a.font : 'grotesk';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.dataset.font = 'grotesk';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
