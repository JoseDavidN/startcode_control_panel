[package]
name = "app"
version = "0.9.1"
description = "StartCode Panel: panel de control de servidores"
authors = ["StartCode"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
# Descargas de Cloud en segundo plano (src/cloud_download.rs). Las mismas
# versiones que ya trae tauri-plugin-updater (reqwest con rustls) y tauri (tokio).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros"] }

# Notificaciones del sistema en macOS (src/macos_notify.rs): el plugin usa
# NSUserNotificationCenter, que no pide permiso y el sistema descarta.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "bitflags",
  "block2",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSettings",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
