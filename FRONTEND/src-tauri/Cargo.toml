[package]
name = "app"
version = "0.1.0"
description = "StartCode Panel: panel de control de servidores"
authors = ["StartCode"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Solo para compilaciones de prueba (`--features devtools`): deja el inspector
# web en el binario de release y lo abre al arrancar. No usar en versiones
# publicadas.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.6.2" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2" }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
