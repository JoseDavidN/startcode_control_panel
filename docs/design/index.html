<style>
  html, body { height: 100%; margin: 0; background: #07050d; font-family: 'Inter', system-ui, sans-serif; color: #f4f1ff; overflow: hidden; }
  /* Scrollbar in content panes */
  .scroll-area::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll-area::-webkit-scrollbar-track { background: transparent; }
  .scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); background-clip: padding-box; }

  /* Glass card base */
  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.025) 100%);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow:
      0 1px 0 0 rgba(255,255,255,0.06) inset,
      0 24px 60px -24px rgba(0,0,0,0.6),
      0 1px 2px rgba(0,0,0,0.4);
  }
  .glass-soft {
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .glass-input {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .glass-input:focus-within {
    border-color: rgba(168,85,247,0.5);
    box-shadow: 0 0 0 4px rgba(168,85,247,0.12);
  }
  .grad-brand { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }
  .grad-brand-soft { background: linear-gradient(135deg, rgba(168,85,247,0.18) 0%, rgba(236,72,153,0.18) 100%); }
  .text-grad-brand {
    background: linear-gradient(135deg, #c084fc 0%, #f472b6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* Animated aurora background blobs */
  .aurora { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; pointer-events: none; will-change: transform; }
  @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(40px,-30px) scale(1.1); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,40px) scale(1.05); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,30px) scale(1.08); } }

  /* Subtle noise/grain overlay for glass authenticity */
  .grain::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.025; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Custom scroll-thin */
  .scroll-thin::-webkit-scrollbar { width: 6px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }

  /* Range slider styling */
  input[type="range"] {
    -webkit-appearance: none; appearance: none; height: 6px; border-radius: 999px;
    background: rgba(255,255,255,0.08); outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
    background: linear-gradient(135deg, #c084fc, #f472b6); cursor: pointer;
    box-shadow: 0 0 0 4px rgba(168,85,247,0.2), 0 2px 6px rgba(0,0,0,0.4);
  }

  /* Hide native number spin buttons except for the styled wrapper */
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* Sidebar item active */
  .nav-active {
    background: linear-gradient(135deg, rgba(168,85,247,0.28), rgba(236,72,153,0.28));
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 8px 24px -8px rgba(168,85,247,0.45), inset 0 1px 0 rgba(255,255,255,0.12);
  }

  /* Animated progress bar shine */
  @keyframes shine {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* Toggle */
  .toggle-track { transition: background 200ms ease; }
  .toggle-dot { transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1); }
</style>

  const P = {

    clock: <svg viewBox="0 0 24 24" {...common}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
    monitor: <svg viewBox="0 0 24 24" {...common}><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>,
    bell: <svg viewBox="0 0 24 24" {...common}><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>,
    gear: <svg viewBox="0 0 24 24" {...common}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.4 1.8l.1.1a2 2 0 01-2.9 2.9l-.1-.1a1.7 1.7 0 00-1.8-.4 1.7 1.7 0 00-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 00-1-1.5 1.7 1.7 0 00-1.9.4l-.1.1a2 2 0 01-2.8-2.9l.1-.1a1.7 1.7 0 00.4-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.4-1.9L4.1 7a2 2 0 012.9-2.8l.1.1a1.7 1.7 0 001.9.4H9a1.7 1.7 0 001-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.4l.1-.1a2 2 0 012.9 2.9l-.1.1a1.7 1.7 0 00-.4 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>,

    key: <svg viewBox="0 0 24 24" {...common}><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg>,

    search: <svg viewBox="0 0 24 24" {...common}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>,
    chevronRight: <svg viewBox="0 0 24 24" {...common}><path d="M9 6l6 6-6 6"/></svg>,

    sparkle: <svg viewBox="0 0 24 24" {...common}><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/></svg>,
  };
  return P[name] || null;
};

/* ── Glass card wrapper ──────────────────────────────────────────── */
const Card = ({ children, className = '', as: As = 'div', ...rest }) => (
  <As className={`glass rounded-2xl relative grain ${className}`} {...rest}>{children}</As>
);

/* ── Top-of-page header (used in dashboard + sub-pages) ─────────── */
const PageHeader = ({ icon, title, subtitle, leading, actions }) => (
  <Card className="px-6 py-5 flex items-center gap-4">
    {leading}
    <div className="w-14 h-14 rounded-2xl grad-brand flex items-center justify-center shadow-[0_8px_24px_-8px_rgba(168,85,247,0.55)]">
      <div className="text-white">{icon}</div>
    </div>
    <div className="flex-1 min-w-0">
      <h1 className="text-2xl font-bold tracking-tight">{title}</h1>
      {subtitle && <p className="text-sm text-white/55 mt-0.5">{subtitle}</p>}
    </div>
    {actions}
  </Card>
);

/* ── Toggle ──────────────────────────────────────────────────────── */
const Toggle = ({ on, onChange }) => (
  <button
    role="switch"
    aria-checked={on}
    onClick={() => onChange?.(!on)}
    className={`toggle-track w-12 h-7 rounded-full relative shrink-0 ${on ? 'grad-brand shadow-[0_4px_14px_-4px_rgba(168,85,247,0.7)]' : 'bg-white/10'} border border-white/10`}
  >
    <span className={`toggle-dot absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white shadow-md ${on ? 'translate-x-5' : ''}`} />
  </button>
);

/* ── Pill button (glass + gradient variants) ─────────────────────── */
const Btn = ({ variant = 'glass', icon, children, className = '', ...rest }) => {
  const base = 'inline-flex items-center gap-2 h-10 px-4 rounded-xl text-sm font-medium transition active:scale-[0.98]';
  const styles = {
    glass: 'glass-soft text-white/85 hover:bg-white/[0.07]',
    brand: 'grad-brand text-white shadow-[0_8px_24px_-8px_rgba(168,85,247,0.55)] hover:shadow-[0_12px_30px_-8px_rgba(236,72,153,0.55)]',
    ghost: 'text-white/70 hover:text-white hover:bg-white/[0.06]',
  };
  return (
    <button className={`${base} ${styles[variant]} ${className}`} {...rest}>
      {icon && <span className="-ml-0.5">{icon}</span>}
      {children}
    </button>
  );
};

/* ── Progress bar (gradient with shimmer) ────────────────────────── */
const Progress = ({ value = 0, gradient = 'from-violet-500 to-fuchsia-500', height = 'h-1.5', track = 'bg-white/[0.06]' }) => (
  <div className={`${track} ${height} rounded-full overflow-hidden relative`}>
    <div
      className={`h-full bg-gradient-to-r ${gradient} rounded-full transition-all duration-700 ease-out relative overflow-hidden`}
      style={{ width: `${Math.min(100, Math.max(0, value))}%` }}
    >
      <div className="absolute inset-0 opacity-50" style={{
        backgroundImage: 'linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%)',
        backgroundSize: '200% 100%',
        animation: 'shine 2.4s linear infinite',
      }} />
    </div>
  </div>
);

/* ── Tile (small icon block used in dashboard server card) ───────── */
const Tile = ({ icon, label, value, tone = 'violet' }) => {
  const tones = {
    violet: 'from-violet-500/25 to-violet-500/5 text-violet-300 ring-violet-400/20',
    emerald: 'from-emerald-500/25 to-emerald-500/5 text-emerald-300 ring-emerald-400/20',
    sky: 'from-sky-500/25 to-sky-500/5 text-sky-300 ring-sky-400/20',
    amber: 'from-amber-500/25 to-amber-500/5 text-amber-300 ring-amber-400/20',
    fuchsia: 'from-fuchsia-500/25 to-fuchsia-500/5 text-fuchsia-300 ring-fuchsia-400/20',
  }[tone];
  return (
    <div className="flex flex-col items-center text-center gap-2">
      <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${tones} ring-1 flex items-center justify-center backdrop-blur-md`}>
        {icon}
      </div>
      <div className="text-[11px] uppercase tracking-wider text-white/45 font-medium">{label}</div>
      <div className="text-lg font-bold tracking-tight">{value}</div>
    </div>
  );
};

/* ── KPI big card (dashboard top row) ────────────────────────────── */
const Kpi = ({ label, value, sub, icon, tone = 'violet', accent }) => {
  const tones = {
    violet: { wrap: 'from-violet-500/30 to-violet-500/10', text: 'text-violet-300', ring: 'ring-violet-400/25' },
    emerald: { wrap: 'from-emerald-500/30 to-emerald-500/10', text: 'text-emerald-300', ring: 'ring-emerald-400/25' },
    sky: { wrap: 'from-sky-500/30 to-sky-500/10', text: 'text-sky-300', ring: 'ring-sky-400/25' },
    amber: { wrap: 'from-amber-500/30 to-amber-500/10', text: 'text-amber-300', ring: 'ring-amber-400/25' },
  }[tone];
  return (
    <Card className="p-5 flex items-center justify-between gap-4 group hover:bg-white/[0.05] transition">
      <div className="min-w-0">
        <div className="text-xs uppercase tracking-wider text-white/50 font-medium">{label}</div>
        <div className={`text-4xl font-extrabold tracking-tight mt-1 ${accent || ''}`}>{value}</div>
        {sub && <div className="text-xs text-white/50 mt-1">{sub}</div>}
      </div>
      <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${tones.wrap} ${tones.text} ring-1 ${tones.ring} flex items-center justify-center backdrop-blur-md`}>
        {icon}
      </div>
    </Card>
  );
};

/* ── Field label + input ─────────────────────────────────────────── */
const Field = ({ label, children, hint }) => (
  <label className="block">
    <div className="text-xs text-white/55 mb-1.5 font-medium">{label}</div>
    {children}
    {hint && <div className="text-xs text-white/40 mt-1.5">{hint}</div>}
  </label>
);

const Input = ({ icon, suffix, className = '', ...rest }) => (
  <div className={`glass-input rounded-xl h-11 flex items-center gap-2 px-3.5 transition ${className}`}>
    {icon && <span className="text-white/45 shrink-0">{icon}</span>}
    <input className="flex-1 bg-transparent outline-none text-sm placeholder:text-white/30" {...rest} />
    {suffix && <span className="text-white/45 shrink-0">{suffix}</span>}
  </div>
);

const Select = ({ icon, children, ...rest }) => (
  <div className="glass-input rounded-xl h-11 flex items-center gap-2 px-3.5 transition w-fit">
    {icon && <span className="text-white/45 shrink-0">{icon}</span>}
    <select className="bg-transparent outline-none text-sm pr-2" {...rest}>
      {children}
    </select>
  </div>
);

/* ── Section heading inside content panes ────────────────────────── */
const SectionTitle = ({ children }) => (
  <h2 className="text-base font-semibold text-white/90 tracking-tight">{children}</h2>
);

/* expose globally to other Babel scripts */
Object.assign(window, {
  Icon, Card, PageHeader, Toggle, Btn, Progress, Tile, Kpi, Field, Input, Select, SectionTitle,
});

</script>
  <script type="text/babel" data-presets="react">
// screens.jsx — dashboard, server detail, settings sub-screens
const { useState: useStateS, useEffect: useEffectS, useMemo: useMemoS } = React;

/* ── Dashboard ───────────────────────────────────────────────────── */
function DashboardScreen({ onOpenServer, onOpenSettings }) {
  const [now, setNow] = useStateS(new Date());
  useEffectS(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  const time = now.toLocaleTimeString('es-CO', { hour12: false });

  return (
    <div className="space-y-6">
      {/* Page header */}

const Sparkline = () => {
  const points = [22, 38, 30, 50, 44, 68, 60, 82, 74, 90, 86, 95];
  const max = 100;
  const d = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${(i / (points.length - 1)) * 160} ${50 - (p / max) * 45}`).join(' ');
  return (
    <svg width="160" height="50" viewBox="0 0 160 50" className="overflow-visible">
      <defs>
        <linearGradient id="spark-g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#34d399" stopOpacity="0.4" />
          <stop offset="100%" stopColor="#34d399" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={`${d} L 160 50 L 0 50 Z`} fill="url(#spark-g)" />
      <path d={d} stroke="#34d399" strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
};

}

const SessionRow = ({ icon, device, meta, current }) => (

}

const ThresholdRow = ({ label, value, onChange, gradient }) => (

const SisRow = ({ label, value, mono, badge }) => (
  <div className="flex items-center justify-between px-4 py-3">

/* expose */
Object.assign(window, { DashboardScreen, ServerDetailScreen, SettingsScreen });

  <script type="text/babel" data-presets="react">
// app.jsx — app shell with sidebar + window chrome
const { useState: useStateA } = React;

function App() {

            ))}

          <div className="text-[10px] uppercase tracking-wider text-white/35 font-semibold px-2 pt-5 pb-2">Cuenta</div>

            {meta.map(([id, label, icon]) => (

        <div className="mt-auto p-3">
          {/* Server status card */}
